name: gostream-preview
services:
  backend:
    image: 127.0.0.1:8081/gostream/gostream-backend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10

  frontend:
    image: 127.0.0.1:8081/gostream/gostream-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
