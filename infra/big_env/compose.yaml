name: gostream-big-env

services:
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
    labels:
      org.gostream.grafana-datasource.checksum: '${GRAFANA_DATASOURCE_CHECKSUM:-}'
    secrets:
      - grafana_admin_password
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana_data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:v3.13.5
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    extra_hosts:
      - 'node-exporter=host-gateway'
    labels:
      org.gostream.prometheus-config.checksum: '${PROMETHEUS_CONFIG_CHECKSUM:-}'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    command: [-config.file=/etc/loki/gostream.yml]
    labels:
      org.gostream.loki-config.checksum: '${LOKI_CONFIG_CHECKSUM:-}'
    configs:
      - source: loki_config
        target: /etc/loki/gostream.yml
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    labels:
      org.gostream.alloy-config.checksum: '${ALLOY_CONFIG_CHECKSUM:-}'
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    restart: unless-stopped
    network_mode: host
    pid: host
    extra_hosts:
      - 'node-exporter=host-gateway'
    command:
      - --path.rootfs=/host
      - --web.listen-address=node-exporter:9100
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: unless-stopped
    cgroup: host
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/containerd:/run/containerd:ro
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false

configs:
  grafana_datasource:
    file: ./grafana-datasource.yml
  prometheus_config:
    file: ./prometheus.yml
  loki_config:
    file: ./loki.yml
  alloy_config:
    file: ./config.alloy

secrets:
  grafana_admin_password:
    file: ./grafana-admin-password

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  alloy_data:
