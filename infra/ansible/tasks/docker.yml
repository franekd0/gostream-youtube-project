---
- name: Check Docker host requirements
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
      - ansible_facts['service_mgr'] == 'systemd'
    fail_msg: This playbook requires a Debian or Ubuntu VM with systemd.

- name: Install CA certificates
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Docker repository signing key
  ansible.builtin.get_url:
    url: "{{ docker_repository }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Docker APT repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: {{ docker_repository }}
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"

- name: Install Docker packages without removing conflicting packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    fail_on_autoremove: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Read the Docker server version
  ansible.builtin.command:
    argv: [docker, version, --format, !unsafe "{{.Server.Version}}"]
  register: docker_server_version
  changed_when: false

- name: Check that Docker supports private loopback publishing
  ansible.builtin.assert:
    that: docker_server_version.stdout is version('28.0.0', '>=')
    fail_msg: Upgrade Docker Engine to 28.0.0 or newer before deploying loopback-only services.
