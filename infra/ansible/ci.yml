---
- name: Deploy the CI stack
  hosts: ci
  become: true
  vars:
    # Keep the deployed project directory so Compose reuses the Jenkins data.
    ci_project_dir: /opt/jenkins
    jenkins_image: jenkins/jenkins:lts-jdk21
    nexus_image: sonatype/nexus3:3.98.3
    jenkins_agent_secret: "{{ lookup('ansible.builtin.env', 'JENKINS_AGENT_SECRET') }}"
    sonar_db_override: >-
      {{ lookup('ansible.builtin.env', 'SONAR_DB_PASSWORD') or
         (lookup('ansible.builtin.ini', 'SONAR_DB_PASSWORD', type='properties',
                 file=ci_local_env_file, interpolation=false, errors='ignore') | default('', true)) }}
    sonar_db_secret: >-
      {{ sonar_db_override or
         (ci_existing_env_content.content | default('') | b64decode
          | regex_findall('(?m)^SONAR_DB_PASSWORD=([^\r\n]*)\r?$') | last | default('')) }}
    deploy_agent_secret: "{{ lookup('ansible.builtin.env', 'DEPLOY_AGENT_SECRET') }}"

  pre_tasks:
    - name: Check for the deployed Compose environment
      ansible.builtin.stat:
        path: "{{ ci_project_dir }}/.env"
        get_checksum: false
      register: ci_existing_env
      when: sonar_db_override | length == 0

    - name: Read the deployed SonarQube database configuration
      ansible.builtin.slurp:
        src: "{{ ci_project_dir }}/.env"
      register: ci_existing_env_content
      when: ci_existing_env.stat.isreg | default(false)
      no_log: true

    - name: Verify that the SonarQube database password is set
      ansible.builtin.assert:
        that: sonar_db_secret | length > 0
        fail_msg: Set SONAR_DB_PASSWORD in the project .env file for the initial deployment.
      no_log: true
    - name: Check the inbound deploy agent secret when provided
      ansible.builtin.assert:
        that: deploy_agent_secret is match('^[0-9a-fA-F]{64}$')
      when: deploy_agent_secret | length > 0
      no_log: true

    - name: Check the inbound Docker agent secret when provided
      ansible.builtin.assert:
        that: jenkins_agent_secret is match('^[0-9a-fA-F]{64}$')
      when: jenkins_agent_secret | length > 0
      no_log: true

  tasks:
    - name: Check the CI images and ports
      ansible.builtin.assert:
        that:
          - jenkins_image is match('^jenkins/jenkins:[a-zA-Z0-9_][a-zA-Z0-9_.-]*$')
          - (jenkins_port | string) is match('^[0-9]+$')
          - (jenkins_port | int) >= 1024
          - (jenkins_port | int) <= 65535
          - nexus_image is match('^sonatype/nexus3:[a-zA-Z0-9_][a-zA-Z0-9_.-]*$')
          - (nexus_port | string) is match('^[0-9]+$')
          - (nexus_port | int) >= 1024
          - (nexus_port | int) <= 65535
          - (nexus_port | int) != (jenkins_port | int)

    - name: Install Docker Engine and Compose
      ansible.builtin.import_tasks: tasks/docker.yml
      vars:
        docker_repository: 'https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}'

    - name: Create the private Compose project directory
      ansible.builtin.file:
        path: "{{ ci_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Upload the Compose project and its build files
      ansible.builtin.copy:
        src: ../ci/
        dest: "{{ ci_project_dir }}/"
        owner: root
        group: root
        mode: preserve

    - name: Create the private CI secrets directory
      ansible.builtin.file:
        path: "{{ ci_project_dir }}/.secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Store the inbound agent secret when provided
      ansible.builtin.copy:
        content: "{{ jenkins_agent_secret }}"
        dest: "{{ ci_project_dir }}/.secrets/jenkins-agent"
        owner: root
        group: "1000"
        mode: "0440"
      when: jenkins_agent_secret | length > 0
      no_log: true

    - name: Check whether the Docker agent has been configured
      ansible.builtin.stat:
        path: "{{ ci_project_dir }}/.secrets/jenkins-agent"
        checksum_algorithm: sha256
      register: jenkins_agent_secret_file

    - name: Store the inbound deploy agent secret when provided
      ansible.builtin.copy:
        content: "{{ deploy_agent_secret }}"
        dest: "{{ ci_project_dir }}/.secrets/deploy-agent"
        owner: root
        group: "1000"
        mode: "0440"
      when: deploy_agent_secret | length > 0
      no_log: true

    - name: Check whether the deploy agent has been configured
      ansible.builtin.stat:
        path: "{{ ci_project_dir }}/.secrets/deploy-agent"
        checksum_algorithm: sha256
      register: deploy_agent_secret_file

    - name: Read the Docker host socket group for the deploy agent
      ansible.builtin.stat:
        path: /var/run/docker.sock
        follow: true
        get_checksum: false
      register: docker_host_socket
      when: deploy_agent_secret_file.stat.exists

    - name: Verify that the Docker host socket is available
      ansible.builtin.assert:
        that: docker_host_socket.stat.issock | default(false)
        fail_msg: The deploy agent requires the Docker socket at /var/run/docker.sock.
      when: deploy_agent_secret_file.stat.exists

    - name: Configure the Compose environment
      no_log: true
      diff: false
      vars:
        agent_profiles: >-
          {{ (['docker-agent'] if jenkins_agent_secret_file.stat.exists else [])
             + (['deploy-agent'] if deploy_agent_secret_file.stat.exists else []) }}
      ansible.builtin.copy:
        content: |
          JENKINS_IMAGE={{ jenkins_image }}
          JENKINS_PORT={{ jenkins_port | int }}
          NEXUS_IMAGE={{ nexus_image }}
          NEXUS_PORT={{ nexus_port | int }}
          SONAR_DB_PASSWORD={{ sonar_db_secret }}
          COMPOSE_PROFILES={{ agent_profiles | join(',') }}
          DOCKER_SOCKET_GID={{ (docker_host_socket.stat | default({})).gid | default('') }}
          DEPLOY_AGENT_SECRET_CHECKSUM={{ deploy_agent_secret_file.stat.checksum | default('') }}
          JENKINS_AGENT_SECRET_CHECKSUM={{ jenkins_agent_secret_file.stat.checksum | default('') }}
        dest: "{{ ci_project_dir }}/.env"
        owner: root
        group: root
        mode: "0600"

    - name: Prepare the Jenkins home directory
      ansible.builtin.file:
        path: "{{ ci_project_dir }}/data"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0700"

    - name: Build and start all CI services and wait for readiness
      ansible.builtin.command:
        argv:
          [
            docker,
            compose,
            --progress,
            plain,
            up,
            --detach,
            --build,
            --wait,
            --wait-timeout,
            "180",
          ]
        chdir: "{{ ci_project_dir }}"
      register: ci_compose_up
      changed_when: >-
        (ci_compose_up.stdout ~ '\n' ~ ci_compose_up.stderr)
        is search('(?m)\b(Created|Started|Recreated)\s*$')

    - name: Wait for Nexus Repository to serve requests
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nexus_port | int }}/service/rest/v1/status"
        use_proxy: false
        status_code: 200
        timeout: 5
      register: nexus_status
      until: nexus_status.status == 200
      retries: 60
      delay: 5
