services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: youtube
      POSTGRES_USER: youtube
      POSTGRES_PASSWORD: youtube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube -d youtube"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://youtube:youtube@database:5432/youtube?sslmode=disable"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 2s
      retries: 10
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

